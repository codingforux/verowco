# Security updates only. The zero PR limit disables routine version updates.
# Security PRs target the default branch; related dependencies are grouped together.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - "@vitest/*"
          - vitest-*
      framework-security:
        applies-to: security-updates
        patterns:
          - svelte
          - "@sveltejs/*"
          - next
          - "@next/*"
          - react
          - react-dom
          - react-server-dom-*
          - eslint-config-next
      electron-security:
        applies-to: security-updates
        patterns:
          - electron
          - "@electron/*"
          - electron-*
      other-security:
        applies-to: security-updates
        patterns:
          - "*"
